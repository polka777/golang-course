
services:
  collector:
    build: ./collector
    ports:
      - "50051:50051"
    command: ./collector
    restart: always

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - COLLECTOR_ADDR=collector:50051
      - REST_PORT=8080
    depends_on:
      - collector
